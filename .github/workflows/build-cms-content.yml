name: Build CMS content

on:
  push:
    branches: [main]
    paths:
      - 'content/prompts/**'
      - 'assets/prompts/**'
      - 'scripts/build_prompts.py'
      - '.pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build prompt pages
        run: python3 scripts/build_prompts.py

      - name: Commit generated site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prompts sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build CMS prompt content"
          git push
